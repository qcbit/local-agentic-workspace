name: Air-Gap Compliance Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  airgap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Static Code Network Egress Scan
        run: |
          echo "Auditing codebase for unauthorized external endpoints..."
          
          # -I: Ignore binary files (fixes the .wasm warning)
          # --exclude: Skip dependency manifests
          # --exclude-dir: Skip node_modules
          # 2>/dev/null: Suppress "No such file or directory" errors
          
          FOUND=$(grep -rnIE \
            --exclude="package-lock.json" \
            --exclude="package.json" \
            --exclude-dir="node_modules" \
            'https?://' apps/ services/ packages/ 2>/dev/null \
            | grep -v '127.0.0.1' \
            | grep -v 'localhost' \
            | grep -v 'schema.org' || true)
            
          if [ -n "$FOUND" ]; then
            echo "ERROR: Found potential external network references:"
            echo "$FOUND"
            exit 1
          fi
          
          echo "Air-gap audit passed: No external HTTP endpoints found."
