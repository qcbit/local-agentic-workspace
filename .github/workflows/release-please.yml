name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['apps/vscode-extension--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/vscode-extension--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-attach:
    needs: release-please
    # 🎯 Only run this job IF the release PR was merged and published
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-14 # Uses Apple Silicon to compile the arm64 binary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          cd apps/vscode-extension
          npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dependencies and Build
        run: |
          # Executes your existing packaging pipeline
          make package

      - name: Upload VSIX to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Locate the newly built .vsix file
          VSIX_FILE=$(find apps/vscode-extension -name "*.vsix")
          MAC_ARM64="${VSIX_FILE%.vsix}-macos-arm64.vsix"
          mv "VSIX_FILE" "MAC_ARM64"
          
          # Upload it directly to the GitHub Release page
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$VSIX_FILE"
