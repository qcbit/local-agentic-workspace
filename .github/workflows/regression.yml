name: Regression Test Suite

description: >-
  Full regression suite — Python lint/typecheck/unit tests and
  TypeScript typecheck/webview/integration tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  #  Python: lint → typecheck → unit tests (with coverage)            #
  # ------------------------------------------------------------------ #
  python-tests:
    name: "Python – lint · typecheck · pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies & test tooling
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install flake8 mypy pytest pytest-cov

      - name: Lint (flake8)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Unit tests (pytest + coverage)
        run: make test-cov

      - name: Upload coverage report (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            htmlcov/
            .coverage
          retention-days: 14

  # ------------------------------------------------------------------ #
  #  TypeScript: typecheck → webview tests → integration tests         #
  # ------------------------------------------------------------------ #
  typescript-tests:
    name: "TypeScript – tsc · jest · vscode-integration"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # better-sqlite3 is a native module — needs build toolchain
      - name: Build native modules (better-sqlite3)
        run: |
          npm rebuild better-sqlite3
          node -e "require('better-sqlite3')" && echo "better-sqlite3 OK"

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build extension & webview bundles
        run: |
          npm run build:extension
          npm run build:webview

      - name: Webview unit tests (Jest)
        run: |
          NODE_OPTIONS='--experimental-vm-modules' npx jest src/webview --ci --reporters=default --reporters=github-actions

      - name: VS Code integration tests
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
            npm run test

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-build
          path: apps/vscode-extension/out/
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Summary gate – fails if any job above failed                     #
  # ------------------------------------------------------------------ #
  regression-passed:
    name: "✅ Regression Suite"
    runs-on: ubuntu-latest
    needs: [python-tests, typescript-tests]
    if: always()

    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "Python tests:    ${{ needs.python-tests.result }}"
          echo "TypeScript tests: ${{ needs.typescript-tests.result }}"

          if [[ "${{ needs.python-tests.result }}" != "success" || \
                "${{ needs.typescript-tests.result }}" != "success" ]]; then
            echo "::error::Regression suite failed — one or more jobs did not succeed."
            exit 1
          fi
          echo "::notice::🎉 All regression tests passed!"
